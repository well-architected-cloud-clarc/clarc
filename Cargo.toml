[package]
name = "clarc"
version = "0.1.0"
edition = "2021"

[dependencies]
c43-layout = { git = "https://github.com/well-architected-cloud-clarc/c43-layout", rev = "86c2c1573b88f0e3252f8a73466a5dffa7df8b2f" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
indexmap = "2"
base64 = "0.22"
