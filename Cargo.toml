[package]
name = "clarc"
version = "0.1.0"
edition = "2021"

[dependencies]
c43-layout = { git = "https://github.com/well-architected-cloud-clarc/c43-layout", rev = "cfa9ea83503080034c16c652d3c6f90af111819e" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
indexmap = "2"
base64 = "0.22"
